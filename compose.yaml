services:

  postgres:
    image: postgres:16.3
    container_name: canyon-postgres
    restart: always
    volumes:
      - ./sql/create-schema.sql:/docker-entrypoint-initdb.d/create-schema.sql
      - ./sql/data-canyon.sql:/docker-entrypoint-initdb.d/data-canyon.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - canyon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      timeout: 5s

  canyon-api:
      build: /home/agustin/IntelliJProjects/canyon-api
      container_name: canyon-api
      restart: always
      ports:
        - "8080:8080"
      env_file:
        - .env
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - canyon-network

networks:
   canyon-network:
        driver: bridge


