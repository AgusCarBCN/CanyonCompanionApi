# =====================================
# DATABASE (DOCKER HOST = postgres)
# =====================================
spring.datasource.url=jdbc:postgresql://postgres:5432/canyon_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA / HIBERNATE
# =====================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# MUY IMPORTANTE: evita que Hibernate ejecute antes de Flyway
spring.jpa.defer-datasource-initialization=true

# =====================================
# FLYWAY
# =====================================
#spring.flyway.enabled=false
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true
#spring.flyway.validate-on-migrate=true

# =====================================
# LOGGING (solo lo necesario)
# =====================================
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.datasource=INFO
logging.level.org.postgresql=ERROR
# =====================================
# MULTIPART (max-file-size: tamaño máximo de cada archivo)
# =====================================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=20MB