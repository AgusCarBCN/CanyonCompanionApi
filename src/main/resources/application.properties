spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Formato bonito para logs de SQL
logging.level.org.hibernate=INFO
logging.level.org.springframework.jdbc.datasource=INFO
logging.level.org.postgresql=ERROR
logging.level.com.canyoncompanion.canyon_api=DEBUG

